---
# Watches the upstream instantlinux/spamassassin releases on Docker Hub.
# The resolved tag is written into the spamd-image-build CronJob (via the
# flux-system:spamassassin-upstream:tag setter), which builds+pushes our custom
# image only when this tag is new.
# NOTE: tag 4.0.2-4 on Docker Hub is a Helm chart manifest, not an image (Flux
# cannot filter tags by media type), so the range excludes exactly that tag via
# an OR clause while still allowing any newer 4.0.x image (e.g. 4.0.3-1).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: spamassassin-upstream
  namespace: flux-system
spec:
  image: instantlinux/spamassassin
  interval: 30m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: spamassassin-upstream
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: spamassassin-upstream
  policy:
    semver:
      range: ">=4.0.0-0 <4.0.2-4 || >=4.0.3-0 <4.1.0-0"
