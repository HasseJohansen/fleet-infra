---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring--monitoring
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/monitoring/app
  prune: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config--monitoring
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
  - name: monitoring--monitoring
  path: ./apps/monitoring/config
  prune: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
