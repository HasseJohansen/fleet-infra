apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  releaseName: harbor
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  interval: 15m
  timeout: 10m
  values:
    externalURL: http://harbor.k8s.musikcheck.dk
    expose:
      type: loadBalancer
      tls:
        enabled: false
      loadBalancer:
        name: harbor
        annotations:
          external-dns.alpha.kubernetes.io/hostname: harbor.k8s.musikcheck.dk.
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          storageClass: longhorn
          accessMode: ReadWriteMany
          size: 100Gi
        jobservice:
          jobLog:
            storageClass: longhorn
            size: 5Gi
        database:
          storageClass: longhorn
          size: 10Gi
        redis:
          storageClass: longhorn
          size: 5Gi
    core:
      replicas: 2
    portal:
      replicas: 2
    nginx:
      replicas: 2
    registry:
      replicas: 2
    jobservice:
      replicas: 1
    trivy:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
