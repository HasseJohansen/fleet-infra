# Builds and pushes harbor.k8s.musikcheck.dk/mail/spamd:<tag>, but only when the
# desired tag is not present in Harbor yet. The desired tag (SPAMD_TAG) is kept up
# to date by Flux ImageUpdateAutomation from the upstream instantlinux/spamassassin
# release (see clusters/minis/registries/spamassassin-upstream.yaml), so a build is
# only ever started for a genuinely new upstream release.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spamd-image-build
  namespace: harbor
spec:
  schedule: "17 * * * *"
  timeZone: Europe/Copenhagen
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: clone
              image: alpine/git:2.49.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /ssh && chmod 700 /ssh
                  cp /git-secret/identity /ssh/identity
                  cp /git-secret/known_hosts /ssh/known_hosts
                  chmod 600 /ssh/identity /ssh/known_hosts
                  export GIT_SSH_COMMAND="ssh -i /ssh/identity -o UserKnownHostsFile=/ssh/known_hosts -o StrictHostKeyChecking=accept-new"
                  git clone --depth 1 --branch main git@github.com:HasseJohansen/fleet-infra.git /src
              volumeMounts:
                - name: src
                  mountPath: /src
                - name: git-secret
                  mountPath: /git-secret
                  readOnly: true
          containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor:v1.23.2-debug # debug variant ships /busybox/sh for the wrapper script
              env:
                - name: SPAMD_TAG
                  value: "4.0.2-3" # {"$imagepolicy": "flux-system:spamassassin-upstream:tag"}
                - name: HARBOR_ROBOT
                  valueFrom:
                    secretKeyRef:
                      name: harbor-robot-push
                      key: username
                - name: HARBOR_ROBOT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: harbor-robot-push
                      key: password
                # Read-only check below: the push robot has no read scope, so it
                # cannot be used to test whether the tag already exists in Harbor.
                - name: HARBOR_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-admin
                      key: HARBOR_ADMIN_PASSWORD
              command: ["/busybox/sh", "-c"]
              args:
                - |
                  set -e
                  echo "desired spamd image tag: ${SPAMD_TAG}"
                  # Skip the build when Harbor already has this tag (no new upstream release).
                  # Check the registry v2 API as the Harbor admin: the /api/v2.0 artifact
                  # path 404s through the front proxy (%2F is decoded before routing),
                  # and the push robot gets 404 on all read endpoints (no pull scope).
                  AUTH="Authorization: Basic $(printf '%s:%s' "admin" "${HARBOR_ADMIN_PASSWORD}" | base64)"
                  if wget -q -O /dev/null \
                      --header="${AUTH}" \
                      --header="Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json" \
                      "http://harbor.harbor.svc.cluster.local/v2/mail/spamd/manifests/${SPAMD_TAG}"; then
                    echo "mail/spamd:${SPAMD_TAG} already in Harbor, nothing to do"
                    exit 0
                  fi
                  mkdir -p /kaniko/.docker
                  printf '{"auths":{"harbor.k8s.musikcheck.dk":{"auth":"%s"}}}' \
                    "$(printf '%s:%s' "${HARBOR_ROBOT}" "${HARBOR_ROBOT_SECRET}" | base64)" \
                    > /kaniko/.docker/config.json
                  /kaniko/executor \
                    --context=dir:///src/images/spamd \
                    --dockerfile=Dockerfile \
                    --build-arg BASE_TAG="${SPAMD_TAG}" \
                    --destination="harbor.k8s.musikcheck.dk/mail/spamd:${SPAMD_TAG}" \
                    --insecure-registry=harbor.k8s.musikcheck.dk \
                    --cache=false
              volumeMounts:
                - name: src
                  mountPath: /src
                  readOnly: true
          volumes:
            - name: src
              emptyDir: {}
            - name: git-secret
              secret:
                secretName: harbor-build-git
                defaultMode: 0400
