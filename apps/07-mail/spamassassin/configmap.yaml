  65_debian.cf: |
    # Special SpamAssassin rules for Debian
    # Duncan Findlay
    
    header	 D_SENT_BY_DEBCONF	Subject =~ /^Debconf:/
    score	 D_SENT_BY_DEBCONF	-5.0
    describe D_SENT_BY_DEBCONF	Sent by Debconf
    
    body	 D_SENT_BY_AFBACKUP	/^\[Afbackup\]: Overall exit status:/
    score	 D_SENT_BY_AFBACKUP	-5.0
    describe D_SENT_BY_AFBACKUP	Sent by Afbackup
    
    header	 D_SENT_BY_APTLC	Subject =~ /^apt-listchanges: (changelogs|news) for/
    score	 D_SENT_BY_APTLC	-5.0
    describe D_SENT_BY_APTLC	Sent by apt-listchanges
    
    header	 __ANACRON_SUBJ		Subject =~ /^Anacron job '[a-z0-9_.-]+' on/i
    header   __ANACRON_FROM		From =~ /^Anacron/
    meta	 D_SENT_BY_ANACRON	__ANACRON_SUBJ && __ANACRON_FROM
    score	 D_SENT_BY_ANACRON	-5.0
    describe D_SENT_BY_ANACRON	Sent by Anacron Daemon
    
    
    header	 __CRON_FROM		From =~ /^Cron Daemon/
    header 	 __CRON_HEADER		X-Cron-Env =~ /./
    meta	 D_SENT_BY_CRON		__CRON_FROM && __CRON_HEADER
    score 	 D_SENT_BY_CRON		-5.0
    describe D_SENT_BY_CRON		Sent by Cron Daemon
    
    # As documented in https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=861671,
    # the bb.barracudacentral.org blacklist requires users to register, making it
    # unsuitable for use in the default configuration. If you've registered your
    # use of this blacklist, remove the following line in order to re-activate
    # this service:
    score RCVD_IN_BRBL_LASTEXT 0
  local.cf: |
    # Adapted from the primary MX host /etc/spamassassin/local.cf:
    # - dns_server 127.0.0.1: unbound sidecar in this pod recurses from the root servers, so
    #   DNSBL queries go out from our own egress IP. Via cluster DNS (10.43.0.10) they would be
    #   forwarded to the ISP resolver and get rate-limited/blocked (RCVD_IN_ZEN_BLOCKED_OPENDNS,
    #   URIBL_BLOCKED) because that resolver is shared with many other users.
    # - lock_method flock -> nflock: bayes DB lives on an RWX (NFS) Longhorn volume, flock is unsafe over NFS
    # - trusted_networks extended with cluster CIDRs and the tailscale range (exim on the Hetzner host)
    # - bayes_path pinned to the shared PVC; pyzor/razor paths adjusted to the Debian config dir
    dns_server 127.0.0.1
    trusted_networks 192.168.0. 10.42.0.0/16 10.43.0.0/16 100.64.0.0/10
    
    bayes_path /var/lib/spamassassin/bayes
    lock_method nflock
    
    bayes_ignore_header X-Bogosity
    bayes_ignore_header X-Spam-Flag
    bayes_ignore_header X-Spam-Status
    bayes_ignore_header X-Spam_flag
    bayes_ignore_header X-Spam_score
    bayes_ignore_header X-Spam_bar
    bayes_ignore_header X-Spam_report
    
    ifplugin Mail::SpamAssassin::Plugin::Shortcircuit
    shortcircuit USER_IN_WHITELIST       on
    shortcircuit USER_IN_DEF_WHITELIST   on
    shortcircuit USER_IN_ALL_SPAM_TO     on
    shortcircuit SUBJECT_IN_WHITELIST    on
    shortcircuit USER_IN_BLACKLIST       on
    shortcircuit USER_IN_BLACKLIST_TO    on
    shortcircuit SUBJECT_IN_BLACKLIST    on
    shortcircuit ALL_TRUSTED             on
    shortcircuit BAYES_99                spam
    shortcircuit BAYES_00                ham
    endif
    
    pyzor_options --homedir /var/lib/spamassassin
    razor_config /var/lib/spamassassin/.razor/razor-agent.conf
    clear_report_template
    report (_SCORE_ / _REQD_ requ) _TESTSSCORES(,)_ autolearn=_AUTOLEARN
    rbl_timeout 30 10
    
    dns_query_restriction deny sa-trusted.bondedsender.org
    dns_query_restriction deny sa-accredit.habeas.com
    dns_query_restriction deny bl.score.senderscore.com
  # Unbound sidecar config: full recursion from the root servers (no forwarding to the
  # cluster/ISP resolver), so DNSBL lookups originate from our own egress IP and are not
  # rate-limited like queries from a shared resolver. spamd reaches it via dns_server 127.0.0.1.
  unbound.conf: |
    server:
      interface: 0.0.0.0
      port: 53
      do-ip4: yes
      do-ip6: no
      do-udp: yes
      do-tcp: yes
      access-control: 127.0.0.0/8 allow
      access-control: 10.42.0.0/16 allow
      access-control: 10.43.0.0/16 allow
      access-control: 192.168.0.0/16 allow
      access-control: 100.64.0.0/10 allow
      access-control: 0.0.0.0/0 refuse
      root-hints: /etc/unbound/root.hints
      module-config: "iterator"
      chroot: ""
      username: ""
      directory: /etc/unbound
      pidfile: /tmp/unbound.pid
      logfile: ""
      use-syslog: no
      verbosity: 1
      hide-identity: yes
      hide-version: yes
      qname-minimisation: yes
      serve-expired: yes
