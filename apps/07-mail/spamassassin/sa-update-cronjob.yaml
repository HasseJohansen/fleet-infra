apiVersion: batch/v1
kind: CronJob
metadata:
  name: spamd-sa-update
  namespace: mail
spec:
  schedule: "0 3 * * 0"
  timeZone: Europe/Copenhagen
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: spamd-sa-update
          restartPolicy: OnFailure
          initContainers:
            - name: fix-bayes-perms
              image: busybox:1.36
              command: ["sh", "-c", "chmod 777 /var/lib/spamassassin || true"]
              volumeMounts:
                - name: bayes
                  mountPath: /var/lib/spamassassin
            - name: sa-update
              image: instantlinux/spamassassin:4.0.2
              command: ["/bin/sh", "-c"]
              args:
                - "sa-update || true; sa-compile || true"
              volumeMounts:
                - name: bayes
                  mountPath: /var/lib/spamassassin
                - name: config
                  mountPath: /etc/mail/spamassassin/local.cf
                  subPath: local.cf
          containers:
            - name: restart-spamd
              image: bitnami/kubectl:1.37
              command: ["kubectl"]
              args:
                - delete
                - pods
                - -n
                - mail
                - -l
                - app=spamd
                - --ignore-not-found=true
          volumes:
            - name: bayes
              persistentVolumeClaim:
                claimName: spamd-bayes
            - name: config
              configMap:
                name: spamd-config
