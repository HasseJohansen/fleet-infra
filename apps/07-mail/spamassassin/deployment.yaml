apiVersion: apps/v1
kind: Deployment
metadata:
  name: spamd
  namespace: mail
  labels:
    app: spamd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spamd
  template:
    metadata:
      labels:
        app: spamd
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spamd
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fix-bayes-perms
          image: busybox:1.36
          command: ["sh", "-c", "chmod 777 /var/lib/spamassassin || true"]
          volumeMounts:
            - name: bayes
              mountPath: /var/lib/spamassassin
        - name: razor-init
          image: harbor.k8s.musikcheck.dk/mail/spamd:4.0.2-3.1
          command: ["sh", "-c", "mkdir -p /var/lib/spamassassin/.razor; if [ ! -e /var/lib/spamassassin/.razor/identity ]; then timeout 30 razor-admin -home /var/lib/spamassassin/.razor -create || true; fi"]
          volumeMounts:
            - name: bayes
              mountPath: /var/lib/spamassassin
      containers:
        - name: spamd
          image: harbor.k8s.musikcheck.dk/mail/spamd:4.0.2-3.1 # {"$imagepolicy": "flux-system:spamassassin"}
          command: ["/usr/sbin/spamd"]
          args:
            - "--listen"
            - "0.0.0.0:783"
            - "--allowed-ips"
            - "127.0.0.1,10.42.0.0/16,10.43.0.0/16,100.64.0.0/10,192.168.0.0/16"
            - "--allow-tell"
            - "--create-prefs"
            - "--max-children"
            - "5"
            - "--timeout-child"
            - "600"
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: USERNAME
              value: debian-spamd
          ports:
            - name: spamd
              containerPort: 783
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - perl
                - -MIO::Socket::IP
                - -e
                - '$s=IO::Socket::IP->new(PeerAddr=>"127.0.0.1",PeerPort=>783,Proto=>"tcp",Timeout=>5) or exit 1; print $s "PING SPAMC/1.0\r\n\r\n"; $r=<$s>; exit(($r=~/PONG/)?0:1)'
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - perl
                - -MIO::Socket::IP
                - -e
                - '$s=IO::Socket::IP->new(PeerAddr=>"127.0.0.1",PeerPort=>783,Proto=>"tcp",Timeout=>5) or exit 1; print $s "PING SPAMC/1.0\r\n\r\n"; $r=<$s>; exit(($r=~/PONG/)?0:1)'
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: bayes
              mountPath: /var/lib/spamassassin
            - name: config
              mountPath: /etc/spamassassin/local.cf
              subPath: local.cf
            - name: config
              mountPath: /etc/spamassassin/init.pre
              subPath: init.pre
            - name: config
              mountPath: /etc/spamassassin/sa-compile.pre
              subPath: sa-compile.pre
            - name: config
              mountPath: /etc/spamassassin/v310.pre
              subPath: v310.pre
            - name: config
              mountPath: /etc/spamassassin/v312.pre
              subPath: v312.pre
            - name: config
              mountPath: /etc/spamassassin/v320.pre
              subPath: v320.pre
            - name: config
              mountPath: /etc/spamassassin/v330.pre
              subPath: v330.pre
            - name: config
              mountPath: /etc/spamassassin/v340.pre
              subPath: v340.pre
            - name: config
              mountPath: /etc/spamassassin/v341.pre
              subPath: v341.pre
            - name: config
              mountPath: /etc/spamassassin/v342.pre
              subPath: v342.pre
            - name: config
              mountPath: /etc/spamassassin/v343.pre
              subPath: v343.pre
            - name: config
              mountPath: /etc/spamassassin/v400.pre
              subPath: v400.pre
            - name: config
              mountPath: /etc/spamassassin/v401.pre
              subPath: v401.pre
            - name: config
              mountPath: /etc/spamassassin/v402.pre
              subPath: v402.pre
            - name: config
              mountPath: /etc/spamassassin/65_debian.cf
              subPath: 65_debian.cf
        - name: unbound
          # Recursive resolver sidecar: spamd's dns_server 127.0.0.1 (see local.cf) points here,
          # so DNSBL queries recurse from the root servers via our own egress IP instead of going
          # through cluster DNS -> ISP resolver (shared, gets rate-limited/blocked by the DNSBLs).
          image: alpinelinux/unbound@sha256:3d1a2772cd413554fec9b8cd399c6878d80fc7789330c7b69ae1b2c09db70030
          command: ["unbound", "-d", "-c", "/etc/unbound/unbound.conf"]
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            exec:
              command: ["nslookup", "example.com", "127.0.0.1"]
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/unbound/unbound.conf
              subPath: unbound.conf
      volumes:
        - name: bayes
          persistentVolumeClaim:
            claimName: spamd-bayes
        - name: config
          configMap:
            name: spamd-config
