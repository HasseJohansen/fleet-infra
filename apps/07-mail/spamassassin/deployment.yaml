apiVersion: apps/v1
kind: Deployment
metadata:
  name: spamd
  namespace: mail
  labels:
    app: spamd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spamd
  template:
    metadata:
      labels:
        app: spamd
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spamd
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fix-bayes-perms
          image: busybox:1.36
          command: ["sh", "-c", "chmod 777 /var/lib/spamassassin || true"]
          volumeMounts:
            - name: bayes
              mountPath: /var/lib/spamassassin
        - name: razor-init
          image: instantlinux/spamassassin:4.0.2
          command: ["sh", "-c", "timeout 30 razor-admin -home /etc/mail/spamassassin/.razor -create || true"]
      containers:
        - name: spamd
          image: instantlinux/spamassassin:4.0.2 # {"$imagepolicy": "flux-system:spamassassin:tag"}
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: USERNAME
              value: debian-spamd
            - name: CRON_HOUR
              value: "2"
            - name: CRON_MINUTE
              value: "45"
            - name: EXTRA_OPTIONS
              value: "--listen 0.0.0.0:783 --allow-tell --create-prefs --max-children 5 --timeout-child 600"
          ports:
            - name: spamd
              containerPort: 783
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: spamd
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: spamd
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: bayes
              mountPath: /var/lib/spamassassin
            - name: config
              mountPath: /etc/mail/spamassassin/local.cf
              subPath: local.cf
            - name: config
              mountPath: /etc/mail/spamassassin/init.pre
              subPath: init.pre
            - name: config
              mountPath: /etc/mail/spamassassin/sa-compile.pre
              subPath: sa-compile.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v310.pre
              subPath: v310.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v312.pre
              subPath: v312.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v320.pre
              subPath: v320.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v330.pre
              subPath: v330.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v340.pre
              subPath: v340.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v341.pre
              subPath: v341.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v342.pre
              subPath: v342.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v343.pre
              subPath: v343.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v400.pre
              subPath: v400.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v401.pre
              subPath: v401.pre
            - name: config
              mountPath: /etc/mail/spamassassin/v402.pre
              subPath: v402.pre
            - name: config
              mountPath: /etc/mail/spamassassin/65_debian.cf
              subPath: 65_debian.cf
      volumes:
        - name: bayes
          persistentVolumeClaim:
            claimName: spamd-bayes
        - name: config
          configMap:
            name: spamd-config
