apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spamd-exporter
  namespace: mail
  labels:
    app: spamd-exporter
    # picked up by prometheus-release-kube-pr-prometheus (serviceMonitorSelector)
    release: prometheus-release
spec:
  selector:
    matchLabels:
      app: spamd-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
