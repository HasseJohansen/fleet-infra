apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-longhorn-annotation
spec:
  # Node writes must not fail-close: this policy targets existing Nodes, which
  # makes Kyverno register core/v1 nodes in the resource-validating webhook.
  # During node boot k3s UPDATEs the Node before flannel is up, and a Fail
  # policy there deadlocks the whole node (webhook unreachable). Ignore keeps
  # boot working; mutation still applies once the cluster is reachable.
  failurePolicy: Ignore
  mutateExistingOnPolicyUpdate: true
  rules:
  - name: add-longhorn-disks
    match:
      resources:
        kinds: 
          - Node
    mutate:
      targets:
        - apiVersion: v1
          kind: Node
      patchStrategicMerge:
        metadata:
          annotations:
            node.longhorn.io/default-disks-config: '[{"path":"/var/lib/longhorn","allowScheduling":true},{"name":"flash","path":"/data","allowScheduling":true,"tags":["ssd","fast"]}]' 
          labels:
            node.longhorn.io/create-default-disk: 'config'
