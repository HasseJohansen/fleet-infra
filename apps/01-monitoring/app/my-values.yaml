grafana:
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  service:
    type: LoadBalancer
    annotations: {
      external-dns.alpha.kubernetes.io/hostname: grafana.k8s.musikcheck.dk.
    }
  grafana.ini:
    server:
      domain: grafana.k8s.musikcheck.dk
      root_url: "%(protocol)s://%(domain)s"
  dashboardProviders:
    dashboardproviders.yaml:
     apiVersion: 1
     providers:
     - name: 'default'
       orgId: 1
       folder: 'default'
       type: file
       disableDeletion: true
       editable: true
       options:
         path: /var/lib/grafana/dashboards/standard
  dashboards:
    default:  
      longhorn:
        gnetId: 16888
        revision: 9
        datasource: prometheus
prometheus:
  service:
    type: LoadBalancer
    annotations: {
      external-dns.alpha.kubernetes.io/hostname: prometheus.k8s.musikcheck.dk.
    }
  prometheusSpec:
    replicas: 2
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
# k3s: control-plane component metrics are not scrapeable (bound to localhost),
# so disable their ServiceMonitors and pointless Down alerts
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeProxyDown: true
alertmanager:
  alertmanagerSpec:
    replicas: 3
  baseURL: "alertmanager.k8s.musikcheck.dk"
  service:
    type: LoadBalancer
    annotations: {
      external-dns.alpha.kubernetes.io/hostname: alertmanager.k8s.musikcheck.dk.
    }
    port: 80

