apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: pushover-recv
  namespace: monitoring
spec:
  route:
    receiver: pushover
    groupBy: ["namespace", "alertname"]
    matchers:
      - matchType: "="
        name: severity
        value: critical
    groupInterval: 15m
    repeatInterval: 24h
  receivers:
  - name: pushover
    pushoverConfigs:
    - sendResolved: true
      token:
        name: pushover-creds
        key: token
      userKey:
        name: pushover-creds
        key: userKey
