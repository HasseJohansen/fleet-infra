# istio-config.yaml
# Flux Kustomization for Istio configuration that depends on Gateway API CRDs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio--config
  namespace: flux-system
spec:
  interval: 10m
  # Wait for Gateway API CRDs to be installed first
  dependsOn:
    - name: gateway-api-crds
      namespace: flux-system
  path: ./apps/00-networking/istio/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
