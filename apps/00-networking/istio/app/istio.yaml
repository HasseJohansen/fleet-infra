---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio--app
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/00-networking/istio/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio--config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: gateway-api-crds
      namespace: flux-system
  path: ./apps/00-networking/istio/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
